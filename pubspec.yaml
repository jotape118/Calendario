name: calendario_voz
description: Calendario personal con captura por voz (local-first).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  go_router: ^17.0.1
  flutter_riverpod: ^2.6.1

  drift: ^2.30.1
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5

  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1

  uuid: ^4.5.2
  intl: ^0.20.2

  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  drift_dev: ^2.30.1

  # ✅ clave: NO uses 3.2.4 por el choque con analyzer 9 + pins de Flutter
  freezed: 3.2.3

  json_serializable: 6.11.2

flutter:
  uses-material-design: true
